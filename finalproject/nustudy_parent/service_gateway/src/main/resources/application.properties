#gataway port and its service name
server.port=80
spring.application.name=service-gateway

#nacos address
spring.cloud.nacos.discovery.server-addr=127.0.0.1:8848

spring.cloud.gateway.server.webflux.discovery.locator.enabled=true

#service-campus
spring.cloud.gateway.server.webflux.routes[0].id=service-campus
spring.cloud.gateway.server.webflux.routes[0].uri=lb://service-campus
spring.cloud.gateway.server.webflux.routes[0].predicates= Path=/*/campus/**

#service-cmn
spring.cloud.gateway.server.webflux.routes[1].id=service-cmn
spring.cloud.gateway.server.webflux.routes[1].uri=lb://service-cmn
spring.cloud.gateway.server.webflux.routes[1].predicates= Path=/*/cmn/**

#service-user
spring.cloud.gateway.server.webflux.routes[2].id=service-user
spring.cloud.gateway.server.webflux.routes[2].uri=lb://service-user
spring.cloud.gateway.server.webflux.routes[2].predicates= Path=/*/user/**

#service-order
spring.cloud.gateway.server.webflux.routes[3].id=service-order
spring.cloud.gateway.server.webflux.routes[3].uri=lb://service-order
spring.cloud.gateway.server.webflux.routes[3].predicates= Path=/*/order/**

